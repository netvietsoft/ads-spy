# Nginx cho Ads Spy — 2 domain:
#   mmo-coin.com      → Web (Next)  127.0.0.1:3062
#   api.mmo-coin.com  → API (Nest)  127.0.0.1:8075  (timeout dài cho FB scraping)
#
# Đặt vào /etc/nginx/sites-available/mmo-coin.com, symlink sang sites-enabled, rồi:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mmo-coin.com -d api.mmo-coin.com
#
# ⚠️ VPS này chạy CHUNG nhiều app khác. Nếu THIẾU server block cho api.mmo-coin.com thì nginx đưa
# request sang `default_server` — tức một app khác — và trả 404 kiểu `Cannot POST /api/auth/login`
# với `x-powered-by: Express`. Triệu chứng đó nghĩa là "sai routing", KHÔNG phải "API chết":
# kiểm bằng `curl http://127.0.0.1:8075/api/health` (hỏi thẳng app, bỏ qua nginx) trước khi sửa app.
#
# Đổi tên từ nginx-dpboss.conf (2026-08-07). Domain cũ dpboss.pet đã bỏ hẳn — nếu trên server còn
# /etc/nginx/sites-enabled/dpboss.pet thì gỡ symlink đi, không thì 2 file cùng khai báo `default_server`
# hoặc trùng server_name sẽ gây routing khó đoán.

# ---- Web ----
server {
    listen 80;
    server_name mmo-coin.com;

    # ⚠️ 2 dòng dưới BẮT BUỘC phải có ở block WEB, không chỉ ở block API.
    # Lý do: FE hiện gọi API **same-origin** (mmo-coin.com/api/*) rồi để Next rewrite vào 127.0.0.1:8075
    # — xem apps/web/.env.production. Nghĩa là MỌI request API đi qua block này, không qua block
    # api.mmo-coin.com nữa. Thiếu chúng thì:
    #   - proxy_read_timeout mặc định 60s → /api/traffic/search (gọi AITDK bên ngoài) và scraping
    #     Facebook 30-60s bị nginx cắt giữa đường → Cloudflare hiện "error code: 502". Gặp thật 2026-08-07.
    #   - client_max_body_size mặc định 1m → import Excel/CSV ShopHunter trả 413.
    client_max_body_size 20m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # ---- API: /backend-api/* → backend TRỰC TIẾP, KHÔNG qua Next ----
    # `^~` = prefix match có ưu tiên cao hơn regex location, nên khối này chắc chắn thắng `location /`.
    # Dấu `/` ở cuối proxy_pass là BẮT BUỘC: nó cắt tiền tố `/backend-api/` rồi mới chuyển tiếp
    #   /backend-api/api/aff-lib/rows  →  http://127.0.0.1:8075/api/aff-lib/rows
    # Nhờ vậy FE chỉ cần đổi NEXT_PUBLIC_API_ORIGIN thành https://mmo-coin.com/backend-api, KHÔNG phải
    # sửa dòng code nào (apps/web/app/api.ts vốn ghép `${API}/api/...`).
    #
    # Vì sao cần khối này: trước đây /api/* đi qua rewrite của Next, mà Next áp trần ~30s cho rewrite —
    # nginx 180s và Cloudflare 100s đều vô nghĩa vì Next cắt trước. Đo 2026-08-07 trên traffic-fill:
    # thẳng backend 201 ở 31,8s, qua Next 500 ở 30,19s. Bỏ Next khỏi đường API là hết hẳn lớp trần đó,
    # và bớt được một chặng proxy. An toàn: `apps/web/app/api/` KHÔNG còn route handler nào (đã kiểm
    # bằng `find app/api -name route.ts`) nên không cướp route nào của Next.
    # ⚠️ CLOUDFLARE: PHẢI có Cache Rule "URI Path starts with /backend-api/ → Bypass cache".
    # Đặt API dưới một PATH của domain web (thay vì subdomain riêng) khiến nó dùng chung chính sách cache
    # với website — một response API bị cache là dữ liệu sai cho mọi người. Với api.mmo-coin.com trước đây
    # thì tắt cache cả hostname là xong, nay không còn lựa chọn đó.
    # Đã xảy ra thật 2026-08-07: trước khi khối này tồn tại, /backend-api/* trả 307 (middleware Next đòi
    # đăng nhập); Cloudflare CACHE cái 307 đó, nên sau khi nginx đã đúng thì qua domain vẫn 307 trong khi
    # `curl -H 'Host: mmo-coin.com' http://127.0.0.1/backend-api/api/health` trả 200. Cách nhận ra nhanh:
    # thêm `?x=$(date +%s)` để lệch cache key — ra 200 tức là đang bị cache.
    location ^~ /backend-api/ {
        proxy_pass http://127.0.0.1:8075/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3062;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---- API ----
server {
    listen 80;
    server_name api.mmo-coin.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8075;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # FB scraping chạy 30-60s → tăng timeout
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
