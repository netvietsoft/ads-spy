# Nginx cho Ads Spy — 2 domain:
#   mmo-coin.com      → Web (Next)  127.0.0.1:3062
#   api.mmo-coin.com  → API (Nest)  127.0.0.1:8075  (timeout dài cho FB scraping)
#
# Đặt vào /etc/nginx/sites-available/mmo-coin.com, symlink sang sites-enabled, rồi:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mmo-coin.com -d api.mmo-coin.com
#
# ⚠️ VPS này chạy CHUNG nhiều app khác. Nếu THIẾU server block cho api.mmo-coin.com thì nginx đưa
# request sang `default_server` — tức một app khác — và trả 404 kiểu `Cannot POST /api/auth/login`
# với `x-powered-by: Express`. Triệu chứng đó nghĩa là "sai routing", KHÔNG phải "API chết":
# kiểm bằng `curl http://127.0.0.1:8075/api/health` (hỏi thẳng app, bỏ qua nginx) trước khi sửa app.
#
# Đổi tên từ nginx-dpboss.conf (2026-08-07). Domain cũ dpboss.pet đã bỏ hẳn — nếu trên server còn
# /etc/nginx/sites-enabled/dpboss.pet thì gỡ symlink đi, không thì 2 file cùng khai báo `default_server`
# hoặc trùng server_name sẽ gây routing khó đoán.

# ---- Web ----
server {
    listen 80;
    server_name mmo-coin.com;

    # ⚠️ 2 dòng dưới BẮT BUỘC phải có ở block WEB, không chỉ ở block API.
    # Lý do: FE hiện gọi API **same-origin** (mmo-coin.com/api/*) rồi để Next rewrite vào 127.0.0.1:8075
    # — xem apps/web/.env.production. Nghĩa là MỌI request API đi qua block này, không qua block
    # api.mmo-coin.com nữa. Thiếu chúng thì:
    #   - proxy_read_timeout mặc định 60s → /api/traffic/search (gọi AITDK bên ngoài) và scraping
    #     Facebook 30-60s bị nginx cắt giữa đường → Cloudflare hiện "error code: 502". Gặp thật 2026-08-07.
    #   - client_max_body_size mặc định 1m → import Excel/CSV ShopHunter trả 413.
    client_max_body_size 20m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:3062;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---- API ----
server {
    listen 80;
    server_name api.mmo-coin.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8075;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # FB scraping chạy 30-60s → tăng timeout
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
